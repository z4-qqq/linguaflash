{% block title %}Create Deck{% endblock %}

{% block content %}
<h2>Create New Deck</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save Deck</button>
</form>
{% endblock %}
