{% extends "flashcards/base.html" %}

{% block title %}Create Flashcard{% endblock %}

{% block content %}
<h2>Create New Flashcard</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save Flashcard</button>
</form>
{% endblock %}
